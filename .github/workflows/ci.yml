name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20 is past EOL but still in package.json "engines"; drop both together.
        node: [20, 22, 24, 26]
        include:
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests replay recorded fixtures; they must never need network or a token.
      - run: npm test
      - run: npm run build
      - name: CLI smoke test (replayed demo case)
        shell: bash
        env:
          FIXEDIN_REPLAY: tests/fixtures/http
          # Fixtures were recorded authenticated (hybrid search + GraphQL). Replay
          # never sends this anywhere; it only selects the authenticated code path.
          GITHUB_TOKEN: replay-only-not-a-real-token
        run: |
          out=$(node dist/cli.js --cwd tests/fixtures/projects/axios-1.1.3 --repo axios/axios < tests/fixtures/stacks/axios-default-create.txt)
          echo "$out"
          grep -q "Upgrade to >=1.2.0" <<<"$out"
          node dist/cli.js --cwd tests/fixtures/projects/axios-1.1.3 --repo axios/axios --json < tests/fixtures/stacks/axios-default-create.txt \
            | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8')); if (r.results[0].verdict.kind!=='FIXED_UPSTREAM_UPGRADE') process.exit(1)"

  fixtures:
    name: No tokens in fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan recorded responses for GitHub tokens
        run: |
          if grep -rEn 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' tests/fixtures; then
            echo "::error::A GitHub token was found in tests/fixtures — re-record without it and rotate the token."
            exit 1
          fi
