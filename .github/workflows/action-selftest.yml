name: Action self-test

# Runs this repo's own GitHub Action (uses: ./) the way users will, against
# the real axios/axios#5011 case: replayed on all three OSes, and live once
# with the workflow's GITHUB_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replayed / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Recorded GitHub/npm responses: deterministic, no quota used.
      FIXEDIN_REPLAY: ${{ github.workspace }}/tests/fixtures/http
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # the action prefers this local build over npm

      - name: A failing test log
        shell: bash
        run: cp tests/fixtures/stacks/axios-default-create.txt test.log

      - name: Run the action
        id: fixedin
        uses: ./
        with:
          log: test.log
          working-directory: tests/fixtures/projects/axios-1.1.3
          repo: axios/axios
          comment: 'false'

      - name: Check the outputs
        shell: bash
        env:
          FIX: ${{ steps.fixedin.outputs.fix-available }}
          CODE: ${{ steps.fixedin.outputs.exit-code }}
          REPORT: ${{ steps.fixedin.outputs.report }}
          MARKDOWN: ${{ steps.fixedin.outputs.markdown }}
        run: |
          set -euo pipefail
          test "$FIX" = true
          test "$CODE" = 1
          node -e "const r=JSON.parse(require('fs').readFileSync(process.env.REPORT,'utf8')); if (r.results[0].verdict.fixedIn !== '1.2.0') process.exit(1)"
          # The job summary is written from this same file ($GITHUB_STEP_SUMMARY is
          # per-step, so a later step can't read what the action wrote there).
          grep -q 'fixedin: this failure was already fixed upstream' "$MARKDOWN"
          grep -q 'shipped in \*\*v1.2.0\*\*' "$MARKDOWN"
          echo "outputs ok"

      - name: fail-on-fix fails the step
        id: strict
        continue-on-error: true
        uses: ./
        with:
          log: test.log
          working-directory: tests/fixtures/projects/axios-1.1.3
          repo: axios/axios
          comment: 'false'
          fail-on-fix: 'true'

      - name: Check fail-on-fix
        shell: bash
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: test "$OUTCOME" = failure && echo "fail-on-fix ok"

  published:
    name: Published package, run inside this repo
    # No local build: the action installs fixedin from npm. Running inside this
    # repo (whose package is also named "fixedin") is the case where `npx
    # fixedin@x` used to run the wrong thing and the step still passed.
    runs-on: ubuntu-latest
    env:
      FIXEDIN_REPLAY: ${{ github.workspace }}/tests/fixtures/http
    steps:
      - uses: actions/checkout@v7
      - name: A failing test log
        run: cp tests/fixtures/stacks/axios-default-create.txt test.log
      - name: Run the action (fixedin from npm)
        id: fixedin
        uses: ./
        with:
          log: test.log
          working-directory: tests/fixtures/projects/axios-1.1.3
          repo: axios/axios
          comment: 'false'
          version: latest
      - name: Check the outputs
        env:
          FIX: ${{ steps.fixedin.outputs.fix-available }}
          CODE: ${{ steps.fixedin.outputs.exit-code }}
          MARKDOWN: ${{ steps.fixedin.outputs.markdown }}
        run: |
          set -euo pipefail
          test "$FIX" = true
          test "$CODE" = 1
          grep -q 'shipped in \*\*v1.2.0\*\*' "$MARKDOWN"
          echo "published package ok"
      - name: A version too old for the action is refused, not misread
        id: old
        continue-on-error: true
        uses: ./
        with:
          log: test.log
          working-directory: tests/fixtures/projects/axios-1.1.3
          repo: axios/axios
          comment: 'false'
          version: 0.4.0
      - name: Check the refusal
        env:
          OUTCOME: ${{ steps.old.outcome }}
          FIX: ${{ steps.old.outputs.fix-available }}
        run: test "$OUTCOME" = failure && test "$FIX" != true && echo "old version refused ok"

  install-retry:
    name: Install retries while npm catches up
    # A stand-in npm fails twice with npm's real "No matching version" error,
    # as it does for a minute or two after a release; the action must retry.
    runs-on: ubuntu-latest
    env:
      FIXEDIN_REPLAY: ${{ github.workspace }}/tests/fixtures/http
      FIXEDIN_INSTALL_RETRY_DELAY: '0'
    steps:
      - uses: actions/checkout@v7
      - name: A flaky npm on the PATH
        run: |
          mkdir -p "$RUNNER_TEMP/flaky"
          real=$(command -v npm)
          cat > "$RUNNER_TEMP/flaky/npm" <<EOF
          #!/usr/bin/env bash
          n=\$(cat "$RUNNER_TEMP/npm-count" 2>/dev/null || echo 0); echo \$((n + 1)) > "$RUNNER_TEMP/npm-count"
          if [ "\$n" -lt 2 ]; then echo "npm error notarget No matching version found for fixedin" >&2; exit 1; fi
          exec "$real" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/flaky/npm"
          echo "$RUNNER_TEMP/flaky" >> "$GITHUB_PATH"
          cp tests/fixtures/stacks/axios-default-create.txt test.log
      - name: Run the action (fixedin from npm)
        id: fixedin
        uses: ./
        with:
          log: test.log
          working-directory: tests/fixtures/projects/axios-1.1.3
          repo: axios/axios
          comment: 'false'
          version: latest
      - name: Check it retried and then worked
        env:
          FIX: ${{ steps.fixedin.outputs.fix-available }}
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/npm-count")" = 3
          test "$FIX" = true
          echo "retried twice, then worked"

  live:
    name: Live GitHub API (workflow token)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: A failing test log
        run: cp tests/fixtures/stacks/axios-default-create.txt test.log

      - name: Run the action (live)
        id: fixedin
        uses: ./
        with:
          log: test.log
          working-directory: tests/fixtures/projects/axios-1.1.3
          repo: axios/axios
          comment: 'false'

      - name: Check the verdict, and which search mode the workflow token got
        env:
          FIX: ${{ steps.fixedin.outputs.fix-available }}
          REPORT: ${{ steps.fixedin.outputs.report }}
        run: |
          set -euo pipefail
          node -e "const r=JSON.parse(require('fs').readFileSync(process.env.REPORT,'utf8')); const x=r.results[0]; console.log('search mode:', x.search.mode, '| verdict:', x.verdict.kind, '| fixed in:', x.verdict.fixedIn, '| match: #' + x.verdict.match?.number)"
          test "$FIX" = true
