name: PR comment test (temporary)

# Temporary: checks that the published fixedin action comments on a pull
# request. This branch is never merged.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: A failing test (deliberately)
        shell: bash
        run: |
          cp tests/fixtures/stacks/axios-default-create.txt test.log
          cat test.log
          exit 1

      - name: Already fixed upstream?
        id: fixedin
        if: failure()
        # This branch's own action, unbuilt: installs fixedin from npm exactly as
        # a released tag would, but with the fixed action/run.sh.
        uses: ./
        with:
          log: test.log
          working-directory: tests/fixtures/projects/axios-1.1.3
          repo: axios/axios

      - name: Debug — what the search returned
        if: always()
        env:
          REPORT: ${{ steps.fixedin.outputs.report }}
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.env.REPORT, 'utf8'));
            console.log('auth:', r.auth.source);
            for (const x of r.results) {
              console.log('repo', x.repo.owner + '/' + x.repo.repo, '| verdict', x.verdict.kind, '| mode', x.search.mode, '| total', x.search.totalCount);
              for (const a of x.search.attempts) console.log('  attempt', a.requested, '->', a.used, a.totalCount, a.error || '', a.skipped || '', (a.fallbackReasons || []).join(','));
              for (const m of x.matches) console.log('  #' + m.number, m.similarity.score, m.title.slice(0, 70));
            }
            for (const d of r.diagnostics) console.log('diag', d.level, d.stage, d.message.slice(0, 160));
          "

  probe-pr-write:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Search variants
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: pr-write
        run: |
          base="repo:axios/axios Cannot read properties of undefined reading 'create'"
          for qual in "is:issue" "type:issue" "is:issue -is:pr"; do
            for mode in hybrid lexical; do
              extra=(); [ "$mode" = hybrid ] && extra=(-f search_type=hybrid)
              gh api -X GET search/issues -f q="$base $qual" -f per_page=5 "${extra[@]}" \
                --jq '"'"$LABEL | $qual | $mode"': total \(.total_count), PRs \([.items[] | select(.pull_request)] | length)/\(.items | length): " + ([.items[].number] | tostring)' || echo "$LABEL | $qual | $mode: request failed"
            done
          done

  probe-pr-write-issues-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Search variants
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: pr-write+issues-read
        run: |
          base="repo:axios/axios Cannot read properties of undefined reading 'create'"
          for qual in "is:issue" "type:issue" "is:issue -is:pr"; do
            for mode in hybrid lexical; do
              extra=(); [ "$mode" = hybrid ] && extra=(-f search_type=hybrid)
              gh api -X GET search/issues -f q="$base $qual" -f per_page=5 "${extra[@]}" \
                --jq '"'"$LABEL | $qual | $mode"': total \(.total_count), PRs \([.items[] | select(.pull_request)] | length)/\(.items | length): " + ([.items[].number] | tostring)' || echo "$LABEL | $qual | $mode: request failed"
            done
          done
