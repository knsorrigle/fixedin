name: Wrong verdict
description: fixedin matched the wrong issue, missed the fix, or named the wrong release
labels: ["wrong-verdict"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Wrong verdicts are the most useful reports — each becomes a regression test.
        **Check the error text below for secrets** (tokens, internal hostnames) before submitting.
  - type: textarea
    id: error
    attributes:
      label: The error you pasted
      description: The exact input (full stack trace if you piped one).
      render: text
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: "`fixedin --json` output"
      description: Run the same command with `--json` and paste the result. It includes the search queries, trace notes and release probes.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the answer have been?
      description: e.g. "the real issue is owner/repo#123, fixed by PR #456 in v2.3.1".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fixedin version
      description: "`fixedin --version`"
    validations:
      required: true
