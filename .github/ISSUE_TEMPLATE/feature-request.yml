name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        fixedin deliberately avoids embeddings, vector databases, LLMs and a web UI. Requests in those areas will likely be declined.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: A real error or workflow where fixedin fell short is ideal.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
